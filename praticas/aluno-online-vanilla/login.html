<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Login Aluno Online</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/javascript.svg">
    <script type="module" src="/src/main.js" defer></script>
</head>
<body class="login-body">
    <main>
        <img src="/learn.svg" alt="Chapéu de formatura preto com cordão caído para a direita">
        <h1>Aluno Online</h1>
        <form action="index.html">
            <label for="email">E-mail</label><input id="email" type="email" required>
            <p id="mensagem-email"></p>
            <label for="senha">Senha</label><input id="senha" type="password" required>
            <p id="mensagem-senha"></p>
            <button id="envio" disabled>Entrar</button>
        </form>
    </main>
    <footer>
        <p>© 2026. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
